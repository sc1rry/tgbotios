<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Next Class">

  <title>Наступна пара</title>

  <link rel="stylesheet" href="./widget.css?v=1">
</head>
<body>
  <main class="widget-shell">
    <section class="widget-card">
      <div class="topline">
        <span class="eyebrow">НАСТУПНА ПАРА</span>
        <button id="refreshBtn" class="refresh" type="button" aria-label="Оновити">
          <svg viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6"/>
          </svg>
        </button>
      </div>

      <div id="subject" class="subject">Завантаження…</div>
      <div id="meta" class="meta">оновлюю розклад</div>

      <div class="bottom">
        <div>
          <div id="dayLabel" class="day">—</div>
          <div id="teacher" class="teacher"></div>
        </div>

        <div class="time-wrap">
          <div id="time" class="time">—</div>
          <div id="room" class="room"></div>
        </div>
      </div>

      <a id="zoomBtn" class="zoom hidden" href="#" target="_blank" rel="noopener">
        Відкрити Zoom
      </a>

      <div class="easter">everything in its right place</div>
    </section>

    <div id="updated" class="updated">—</div>
  </main>

  <script src="./widget.js?v=1" defer></script>
</body>
</html>
